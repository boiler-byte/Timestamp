<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unix Timestamp Tool · Neon</title>
  <style>
    /* ---------- RESET / BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0a0c0f;
      background-image: radial-gradient(circle at 20% 20%, rgba(0, 255, 255, 0.08) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.08) 0%, transparent 35%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 1.2rem;
    }

    /* ---------- SCROLLBAR (global) ---------- */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #12161c;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a3a4a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00ffff66;
    }

    /* ---------- TOPBAR ---------- */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: rgba(10, 15, 22, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #1e2a3a;
      border-radius: 3rem;
      padding: 0.6rem 1.6rem;
      margin-bottom: 1.8rem;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.15), 0 0 10px rgba(255, 0, 255, 0.1);
      position: relative; /* Bezugspunkt für Dropdown */
      z-index: 50;
    }

    .live-clocks {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      align-items: center;
    }

    .live-btn {
      background: #0f141c;
      border: 1px solid #2a3f55;
      border-radius: 2rem;
      padding: 0.45rem 1.2rem;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.95rem;
      color: #b0e0ff;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
      letter-spacing: 0.5px;
    }

    .live-btn:hover {
      border-color: #00ffff;
      box-shadow: 0 0 18px #00ffff88, 0 0 8px #ff00ff44;
      color: #ffffff;
      background: #14202e;
    }

    .live-btn svg {
      width: 18px;
      height: 18px;
      stroke: #00ffff;
      filter: drop-shadow(0 0 4px #00ffff);
    }

    .live-value {
      font-weight: 600;
    }

    .history-toggle {
      background: transparent;
      border: 1px solid #ff00ff66;
      border-radius: 2rem;
      padding: 0.45rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #ffb3ff;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 12px #ff00ff33;
      letter-spacing: 1px;
    }

    .history-toggle:hover {
      background: #ff00ff18;
      border-color: #ff00ff;
      box-shadow: 0 0 24px #ff00ff88;
      color: #ffffff;
    }

    /* ---------- HISTORY DROPDOWN ---------- */
    .history-panel {
      position: absolute;
      top: calc(100% + 0.6rem);
      right: 1.6rem;
      min-width: 300px;
      max-width: calc(100vw - 2.4rem);
      background: #0e131b;
      border: 1px solid #2a3f55;
      border-radius: 1.5rem;
      padding: 1rem 1.2rem;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 0 30px #00ffff33, 0 12px 40px #000000aa, inset 0 0 20px #00000080;
      backdrop-filter: blur(8px);
      z-index: 100;

      /* Scrollbar im Dropdown ausblenden */
      scrollbar-width: none;          /* Firefox */
      -ms-overflow-style: none;       /* IE / Edge Legacy */
    }
    .history-panel::-webkit-scrollbar {
      display: none;                  /* Chrome / Safari / Edge */
      width: 0;
      height: 0;
    }

    .history-panel.open {
      display: block;
      animation: dropdownFade 0.18s ease-out;
    }

    @keyframes dropdownFade {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      background: #111a24;
      border-left: 4px solid #00ffff;
      padding: 0.6rem 1rem;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #b8e2ff;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #1e2e3e;
      box-shadow: 0 0 6px #00ffff22;
    }

    .history-item:hover {
      background: #1a2a3a;
      border-left-color: #ff00ff;
      box-shadow: 0 0 16px #ff00ff44;
      color: #ffffff;
    }

    .history-empty {
      color: #6b7b8b;
      font-style: italic;
      padding: 0.8rem;
      text-align: center;
      font-size: 0.9rem;
    }

    /* ---------- GRID ---------- */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
      margin-bottom: 2rem;
      margin: 0 auto 2rem;
      max-width: 1200px;
    }

    /* ---------- CARD ---------- */
    .card {
      background: rgba(14, 20, 28, 0.75);
      backdrop-filter: blur(4px);
      border: 1px solid #223344;
      border-radius: 2rem;
      padding: 1.6rem 1.4rem;
      box-shadow: 0 0 30px #00ffff11, inset 0 0 30px #00000066;
      transition: box-shadow 0.3s;
    }

    .card:focus-within {
      box-shadow: 0 0 40px #00ffff44, 0 0 15px #ff00ff22, inset 0 0 30px #00000066;
      border-color: #2f5a7a;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7aa9cc;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e2f3f;
      padding-bottom: 0.7rem;
    }

    .card h2 svg {
      stroke: #00ffff;
      filter: drop-shadow(0 0 6px #00ffff);
    }

    /* ---------- INPUT ---------- */
    .input-group {
      margin-bottom: 1.6rem;
    }

    .input-group input {
      width: 100%;
      background: #0b1118;
      border: 1px solid #2a3f55;
      border-radius: 2.5rem;
      padding: 0.9rem 1.4rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 1rem;
      color: #e0f0ff;
      outline: none;
      transition: 0.2s;
      box-shadow: inset 0 0 15px #00000080, 0 0 6px #00ffff22;
      letter-spacing: 0.5px;
    }

    .input-group input:focus {
      border-color: #00ffff;
      box-shadow: inset 0 0 15px #00000080, 0 0 20px #00ffff66, 0 0 8px #ff00ff44;
      background: #0f1822;
    }

    .input-group input.invalid {
      border-color: #ff3b6b;
      box-shadow: inset 0 0 15px #00000080, 0 0 20px #ff3b6b88;
      background: #1a0f14;
    }

    /* ---------- INFO LIST ---------- */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d141d;
      border-radius: 2rem;
      padding: 0.45rem 0.9rem 0.45rem 1.2rem;
      border: 1px solid #1a2b3a;
      transition: 0.15s;
      min-height: 2.8rem;
    }

    .info-row:hover {
      border-color: #2f5a7a;
      background: #111e2a;
    }

    .info-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      color: #7b9bb8;
      flex: 0 0 auto;
      width: 95px;
    }

    .info-value {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
      color: #b8e2ff;
      text-align: right;
      flex: 1;
      padding: 0 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      text-shadow: 0 0 6px #00ffff33;
      letter-spacing: 0.3px;
    }

    .copy-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: 0.2s;
      color: #3e6a8a;
      flex: 0 0 30px;
      height: 30px;
      width: 30px;
    }

    .copy-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .copy-btn:hover {
      color: #00ffff;
      background: #00ffff18;
      filter: drop-shadow(0 0 6px #00ffff);
    }

    .copy-btn.copied {
      color: #00ffaa;
      filter: drop-shadow(0 0 10px #00ffaa);
    }

    .copy-btn.copied svg {
      stroke: #00ffaa;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .topbar {
        border-radius: 1.8rem;
        padding: 0.8rem 1.2rem;
        justify-content: center;
      }
      .live-clocks {
        justify-content: center;
      }
      .info-label {
        width: 80px;
        font-size: 0.7rem;
      }
      .info-value {
        font-size: 0.8rem;
      }
      .history-panel {
        right: 0.8rem;
        left: 0.8rem;
        width: auto;
      }
    }

    @media (max-width: 480px) {
      body { padding: 0.8rem; }
      .card { padding: 1.2rem 1rem; }
      .live-btn { font-size: 0.8rem; padding: 0.4rem 0.9rem; }
      .history-toggle { font-size: 0.8rem; padding: 0.4rem 1rem; }
      .info-row { padding: 0.4rem 0.6rem 0.4rem 0.8rem; }
      .info-label { width: 70px; font-size: 0.65rem; }
      .info-value { font-size: 0.75rem; }
      .copy-btn { flex: 0 0 26px; height: 26px; width: 26px; }
      .copy-btn svg { width: 16px; height: 16px; }
    }

    /* ---------- ANIMATION ---------- */
    @keyframes pulseGlow {
      0% { text-shadow: 0 0 6px #00ffff55; }
      50% { text-shadow: 0 0 16px #00ffffcc, 0 0 6px #ff00ff55; }
      100% { text-shadow: 0 0 6px #00ffff55; }
    }

    .live-value {
      animation: pulseGlow 2s infinite;
    }

    /* ---------- UTILITY ---------- */
    .hidden { display: none; }
  </style>
</head>
<body>

<!-- ========== TOPBAR ========== -->
<div class="topbar">
  <div class="live-clocks">
    <button class="live-btn" id="unixLiveBtn" title="In Eingabefeld A oder letztes fokussiertes Feld einfügen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>Unixzeit:</span>
      <span class="live-value" id="unixLiveValue">0</span>
    </button>
    <button class="live-btn" id="localLiveBtn" title="In Eingabefeld A oder letztes fokussiertes Feld einfügen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>Lokal:</span>
      <span class="live-value" id="localLiveValue">--:--:--</span>
    </button>
  </div>
  <button class="history-toggle" id="historyToggleBtn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="12 8 12 12 16 14"/><circle cx="12" cy="12" r="10"/>
    </svg>
    Verlauf
  </button>

  <!-- ========== HISTORY DROPDOWN (jetzt innerhalb der Topbar) ========== -->
  <div class="history-panel" id="historyPanel">
    <ul class="history-list" id="historyList">
      <li class="history-empty">Noch keine Einträge</li>
    </ul>
  </div>
</div>

<!-- ========== MAIN GRID ========== -->
<div class="grid">
  <!-- === ZEITPUNKT A === -->
  <div class="card" id="cardA">
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Zeitpunkt A
    </h2>
    <div class="input-group">
      <input type="text" id="inputA" placeholder="z.B. 2025-01-01, 1792516020, 1792516020 +3d" autocomplete="off" spellcheck="false">
    </div>
    <div class="info-list" id="infoA">
      <!-- Wird per JS befüllt -->
    </div>
  </div>

  <!-- === ZEITPUNKT B === -->
  <div class="card" id="cardB">
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Zeitpunkt B
    </h2>
    <div class="input-group">
      <input type="text" id="inputB" placeholder="z.B. 2025-01-01, 1792516020, +3d (relativ zu A)" autocomplete="off" spellcheck="false">
    </div>
    <div class="info-list" id="infoB">
      <!-- Wird per JS befüllt -->
    </div>
  </div>
</div>

<script>
  // ============================================================
  // KONSTANTEN & GLOBALE VARIABLEN
  // ============================================================
  const STORAGE_KEY = 'timestampTool';
  const MAX_HISTORY = 50;

  let lastFocusedInput = 'A'; // 'A' oder 'B'
  let currentTimestampA = null; // Unix Sekunden oder null
  let currentTimestampB = null; // Unix Sekunden oder null

  // DOM-Elemente
  const inputA = document.getElementById('inputA');
  const inputB = document.getElementById('inputB');
  const infoAContainer = document.getElementById('infoA');
  const infoBContainer = document.getElementById('infoB');
  const unixLiveValue = document.getElementById('unixLiveValue');
  const localLiveValue = document.getElementById('localLiveValue');
  const historyPanel = document.getElementById('historyPanel');
  const historyList = document.getElementById('historyList');
  const historyToggleBtn = document.getElementById('historyToggleBtn');

  // ============================================================
  // HILFSFUNKTIONEN: FORMATIERUNG
  // ============================================================

  function formatDateTimeLocal(timestampSec) {
    if (timestampSec === null || timestampSec === undefined) return '—';
    const d = new Date(timestampSec * 1000);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const seconds = String(d.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
  }

  function formatDateLocal(timestampSec) {
    if (timestampSec === null || timestampSec === undefined) return '—';
    const d = new Date(timestampSec * 1000);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function formatISO(timestampSec) {
    if (timestampSec === null || timestampSec === undefined) return '—';
    const d = new Date(timestampSec * 1000);
    return d.toISOString();
  }

  function formatUTC(timestampSec) {
    if (timestampSec === null || timestampSec === undefined) return '—';
    const d = new Date(timestampSec * 1000);
    const year = d.getUTCFullYear();
    const month = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    const hours = String(d.getUTCHours()).padStart(2, '0');
    const minutes = String(d.getUTCMinutes()).padStart(2, '0');
    const seconds = String(d.getUTCSeconds()).padStart(2, '0');
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds} UTC`;
  }

  function formatLocal(timestampSec) {
    if (timestampSec === null || timestampSec === undefined) return '—';
    const d = new Date(timestampSec * 1000);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const seconds = String(d.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds} (Lokal)`;
  }

  function formatRelative(timestampSec) {
    if (timestampSec === null || timestampSec === undefined) return '—';
    const now = Math.floor(Date.now() / 1000);
    const diff = timestampSec - now;
    const absDiff = Math.abs(diff);
    const days = Math.floor(absDiff / 86400);
    const hours = Math.floor((absDiff % 86400) / 3600);
    const minutes = Math.floor((absDiff % 3600) / 60);
    const seconds = absDiff % 60;

    if (absDiff < 60) {
      if (absDiff <= 1) return diff === 0 ? 'gerade eben' : (diff > 0 ? 'in 1 Sekunde' : 'vor 1 Sekunde');
      return diff > 0 ? `in ${absDiff} Sekunden` : `vor ${absDiff} Sekunden`;
    }

    let parts = [];
    if (days > 0) parts.push(`${days} ${'T'}`);
    if (hours > 0) parts.push(`${hours} ${'Std'}`);
    if (minutes > 0) parts.push(`${minutes} ${'Min'}`);
    if (parts.length === 0) parts.push(`${seconds} Sek`);

    const human = parts.join(' ');
    return diff > 0 ? `in ${human}` : `vor ${human}`;
  }

  function formatDuration(seconds) {
    if (seconds === null || seconds === undefined) return '—';
    const absSec = Math.abs(seconds);
    const days = Math.floor(absSec / 86400);
    const hours = Math.floor((absSec % 86400) / 3600);
    const minutes = Math.floor((absSec % 3600) / 60);
    const secs = absSec % 60;

    const parts = [];
    if (days > 0) parts.push(`${days} ${'T'}`);
    if (hours > 0) parts.push(`${hours} ${'Std'}`);
    if (minutes > 0) parts.push(`${minutes} ${'Min'}`);
    if (secs > 0 || parts.length === 0) parts.push(`${secs} Sek`);

    return parts.join(' ');
  }

  function getDirectionText(tsA, tsB) {
    if (tsA === null || tsB === null) return '—';
    if (tsA === tsB) return 'A = B';
    const diff = tsB - tsA;
    const absDiff = Math.abs(diff);
    const durationStr = formatDuration(absDiff);
    if (diff > 0) {
      return `B liegt ${durationStr} nach A`;
    } else {
      return `B liegt ${durationStr} vor A`;
    }
  }

  // ============================================================
  // PARSING & ARITHMETIK
  // ============================================================

  function parseBase(input) {
    const trimmed = input.trim();
    if (!trimmed) return null;

    if (/^\d+$/.test(trimmed)) {
      const ts = parseInt(trimmed, 10);
      if (ts >= 0 && ts <= 253402300799) {
        return ts;
      }
      return null;
    }

    const dateTimeRegex = /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})(?::(\d{2}))?$/;
    let match = trimmed.match(dateTimeRegex);
    if (match) {
      const year = parseInt(match[1], 10);
      const month = parseInt(match[2], 10) - 1;
      const day = parseInt(match[3], 10);
      const hours = parseInt(match[4], 10);
      const minutes = parseInt(match[5], 10);
      const seconds = match[6] ? parseInt(match[6], 10) : 0;

      const d = new Date(year, month, day, hours, minutes, seconds);
      if (isNaN(d.getTime())) return null;
      if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day ||
          d.getHours() !== hours || d.getMinutes() !== minutes || d.getSeconds() !== seconds) {
        return null;
      }
      return Math.floor(d.getTime() / 1000);
    }

    const dateRegex = /^(\d{4})-(\d{2})-(\d{2})$/;
    match = trimmed.match(dateRegex);
    if (match) {
      const year = parseInt(match[1], 10);
      const month = parseInt(match[2], 10) - 1;
      const day = parseInt(match[3], 10);
      const d = new Date(year, month, day);
      if (isNaN(d.getTime())) return null;
      if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) return null;
      return Math.floor(d.getTime() / 1000);
    }

    return null;
  }

  function parseArithmeticPart(input) {
    const trimmed = input.trim();
    const arithRegex = /^(.*?)\s*([+-])\s*(\d+)\s*([dmy])$/i;
    const match = trimmed.match(arithRegex);
    if (!match) return null;

    const baseStr = match[1].trim();
    const op = match[2];
    const amount = parseInt(match[3], 10);
    const unit = match[4].toLowerCase();

    if (amount < 0) return null;

    return { baseStr, op, amount, unit };
  }

  function applyArithmetic(timestampSec, op, amount, unit) {
    if (timestampSec === null) return null;
    const d = new Date(timestampSec * 1000);

    if (unit === 'd') {
      const deltaMs = amount * 86400 * 1000;
      const newTime = d.getTime() + (op === '+' ? deltaMs : -deltaMs);
      return Math.floor(newTime / 1000);
    } else if (unit === 'm') {
      const currentMonth = d.getMonth();
      const targetMonth = op === '+' ? currentMonth + amount : currentMonth - amount;
      d.setMonth(targetMonth);
      return Math.floor(d.getTime() / 1000);
    } else if (unit === 'y') {
      const currentYear = d.getFullYear();
      const targetYear = op === '+' ? currentYear + amount : currentYear - amount;
      d.setFullYear(targetYear);
      return Math.floor(d.getTime() / 1000);
    }
    return null;
  }

  function resolveInput(input, fallbackBase = null) {
    const trimmed = input.trim();
    if (!trimmed) return null;

    const arith = parseArithmeticPart(trimmed);
    if (arith) {
      let baseTimestamp = null;
      if (arith.baseStr === '') {
        if (fallbackBase === null) return null;
        baseTimestamp = fallbackBase;
      } else {
        baseTimestamp = parseBase(arith.baseStr);
        if (baseTimestamp === null) return null;
      }
      return applyArithmetic(baseTimestamp, arith.op, arith.amount, arith.unit);
    } else {
      return parseBase(trimmed);
    }
  }

  // ============================================================
  // RENDERING DER INFO-ZEILEN
  // ============================================================

  function createInfoRow(label, value) {
    const row = document.createElement('div');
    row.className = 'info-row';

    const labelEl = document.createElement('span');
    labelEl.className = 'info-label';
    labelEl.textContent = label;

    const valueEl = document.createElement('span');
    valueEl.className = 'info-value';
    valueEl.textContent = value;
    valueEl.title = value;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    `;
    copyBtn.title = 'Kopieren';
    copyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      copyToClipboard(value, copyBtn);
    });

    row.appendChild(labelEl);
    row.appendChild(valueEl);
    row.appendChild(copyBtn);
    return row;
  }

  function copyToClipboard(text, buttonEl) {
    navigator.clipboard.writeText(text).then(() => {
      if (buttonEl) {
        buttonEl.classList.add('copied');
        setTimeout(() => {
          buttonEl.classList.remove('copied');
        }, 1200);
      }
    }).catch(err => {
      console.warn('Clipboard fehlgeschlagen:', err);
    });
  }

  function renderInfoA(timestampSec) {
    infoAContainer.innerHTML = '';
    if (timestampSec === null) {
      const emptyMsg = document.createElement('div');
      emptyMsg.className = 'info-row';
      emptyMsg.style.justifyContent = 'center';
      emptyMsg.style.color = '#6b7b8b';
      emptyMsg.style.fontStyle = 'italic';
      emptyMsg.textContent = 'Keine gültige Eingabe';
      infoAContainer.appendChild(emptyMsg);
      return;
    }

    const rows = [
      { label: 'Unix Timestamp', value: String(timestampSec) },
      { label: 'YYYY-MM-DD HH:MM:ss', value: formatDateTimeLocal(timestampSec) },
      { label: 'YYYY-MM-DD', value: formatDateLocal(timestampSec) },
      { label: 'ISO 8601', value: formatISO(timestampSec) },
      { label: 'UTC', value: formatUTC(timestampSec) },
      { label: 'Lokal', value: formatLocal(timestampSec) },
      { label: 'Relativ', value: formatRelative(timestampSec) },
    ];

    rows.forEach(({ label, value }) => {
      infoAContainer.appendChild(createInfoRow(label, value));
    });
  }

  function renderInfoB(timestampA, timestampB) {
    infoBContainer.innerHTML = '';
    if (timestampB === null) {
      const emptyMsg = document.createElement('div');
      emptyMsg.className = 'info-row';
      emptyMsg.style.justifyContent = 'center';
      emptyMsg.style.color = '#6b7b8b';
      emptyMsg.style.fontStyle = 'italic';
      emptyMsg.textContent = 'Keine gültige Eingabe';
      infoBContainer.appendChild(emptyMsg);
      return;
    }

    const rows = [];

    const zeitraum = (timestampA !== null) ? `${timestampA} AND ${timestampB}` : '— (A fehlt)';

    let diffSec = null;
    let diffHuman = '—';
    let direction = '—';
    if (timestampA !== null) {
      diffSec = timestampB - timestampA;
      diffHuman = formatDuration(Math.abs(diffSec));
      direction = getDirectionText(timestampA, timestampB);
    }

    rows.push({ label: 'Unix Timestamp', value: String(timestampB) });
    rows.push({ label: 'YYYY-MM-DD HH:MM:ss', value: formatDateTimeLocal(timestampB) });
    rows.push({ label: 'YYYY-MM-DD', value: formatDateLocal(timestampB) });

    rows.push({ label: 'Unix Zeitraum', value: zeitraum });

    rows.push({ label: 'Differenz', value: diffHuman });
    rows.push({ label: 'Differenz in Sek.', value: diffSec !== null ? String(diffSec) : '—' });
    rows.push({ label: 'Richtung', value: direction });

    rows.forEach(({ label, value }) => {
      infoBContainer.appendChild(createInfoRow(label, value));
    });
  }

  // ============================================================
  // HAUPT-UPDATE-FUNKTION
  // ============================================================

  function updateAll() {
    const rawA = inputA.value;
    const rawB = inputB.value;

    const tsA = resolveInput(rawA, null);
    const tsB = resolveInput(rawB, tsA);

    if (rawA.trim() !== '' && tsA === null) {
      inputA.classList.add('invalid');
    } else {
      inputA.classList.remove('invalid');
    }

    if (rawB.trim() !== '' && tsB === null) {
      inputB.classList.add('invalid');
    } else {
      inputB.classList.remove('invalid');
    }

    currentTimestampA = tsA;
    currentTimestampB = tsB;

    renderInfoA(tsA);
    renderInfoB(tsA, tsB);

    saveToHistory(tsA, tsB);
  }

  // ============================================================
  // VERLAUF (STORAGE)
  // ============================================================

  function loadHistory() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return [];
      const parsed = JSON.parse(stored);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.warn('Fehler beim Laden des Verlaufs:', e);
      return [];
    }
  }

  function persistHistory(historyArray) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(historyArray));
    } catch (e) {
      console.warn('Fehler beim Speichern des Verlaufs:', e);
    }
  }

  function addHistoryEntry(tsA, tsB) {
    if (tsA === null) return;

    const history = loadHistory();
    const newEntry = { a: tsA, b: tsB };

    const isDuplicate = history.some(entry => entry.a === tsA && entry.b === tsB);
    if (isDuplicate) {
      return;
    }

    history.unshift(newEntry);
    if (history.length > MAX_HISTORY) {
      history.length = MAX_HISTORY;
    }
    persistHistory(history);
    renderHistoryList();
  }

  function saveToHistory(tsA, tsB) {
    if (tsA === null) return;
    addHistoryEntry(tsA, tsB);
  }

  function renderHistoryList() {
    const history = loadHistory();
    historyList.innerHTML = '';

    if (history.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'history-empty';
      empty.textContent = 'Noch keine Einträge';
      historyList.appendChild(empty);
      return;
    }

    history.forEach(entry => {
      const li = document.createElement('li');
      li.className = 'history-item';

      const dateA = formatDateTimeLocal(entry.a);
      let text = dateA;
      if (entry.b !== null && entry.b !== undefined) {
        const dateB = formatDateTimeLocal(entry.b);
        text = `${dateA} – ${dateB}`;
      }

      li.textContent = text;
      li.title = 'Klicken, um diesen Zeitpunkt wiederherzustellen';
      li.addEventListener('click', () => {
        inputA.value = String(entry.a);
        if (entry.b !== null && entry.b !== undefined) {
          inputB.value = String(entry.b);
        } else {
          inputB.value = '';
        }
        updateAll();
        // Dropdown nach Auswahl schließen
        historyPanel.classList.remove('open');
      });

      historyList.appendChild(li);
    });
  }

  function toggleHistoryPanel() {
    historyPanel.classList.toggle('open');
    if (historyPanel.classList.contains('open')) {
      renderHistoryList();
    }
  }

  // ============================================================
  // LIVE-UHREN & CLIPBOARD-BUTTONS IN DER TOPBAR
  // ============================================================

  function updateLiveClocks() {
    const now = Math.floor(Date.now() / 1000);
    unixLiveValue.textContent = now;

    const d = new Date(now * 1000);
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const seconds = String(d.getSeconds()).padStart(2, '0');
    localLiveValue.textContent = `${hours}:${minutes}:${seconds}`;
  }

  function insertIntoFocusedInput(value) {
    const targetInput = lastFocusedInput === 'A' ? inputA : inputB;
    targetInput.value = String(value);
    targetInput.focus();
    updateAll();
  }

  // ============================================================
  // EVENT-LISTENER
  // ============================================================

  inputA.addEventListener('focus', () => { lastFocusedInput = 'A'; });
  inputB.addEventListener('focus', () => { lastFocusedInput = 'B'; });

  let inputTimeout;
  function handleInputChange() {
    clearTimeout(inputTimeout);
    inputTimeout = setTimeout(() => {
      updateAll();
    }, 150);
  }
  inputA.addEventListener('input', handleInputChange);
  inputB.addEventListener('input', handleInputChange);

  document.getElementById('unixLiveBtn').addEventListener('click', () => {
    const now = Math.floor(Date.now() / 1000);
    insertIntoFocusedInput(now);
  });

  document.getElementById('localLiveBtn').addEventListener('click', () => {
    const d = new Date();
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const seconds = String(d.getSeconds()).padStart(2, '0');
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const dateTimeStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    insertIntoFocusedInput(dateTimeStr);
  });

  historyToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleHistoryPanel();
  });

  // Klick außerhalb schließt das Dropdown
  document.addEventListener('click', (e) => {
    if (!historyPanel.classList.contains('open')) return;
    if (historyPanel.contains(e.target) || historyToggleBtn.contains(e.target)) return;
    historyPanel.classList.remove('open');
  });

  // ============================================================
  // INITIALISIERUNG
  // ============================================================

  updateLiveClocks();
  setInterval(updateLiveClocks, 1000);

  renderHistoryList();

  setTimeout(() => {
    updateAll();
  }, 50);
</script>
</body>
